<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Study Hours Tracker</title>
</head>
<body>
    <h2>Weekly Study Hours Tracker</h2>

    <!-- Input fields -->
    <label for="subjectInput">Subject Name:</label><br>
    <input type="text" id="subjectInput" placeholder="Enter subject name"><br><br>

    <label for="hoursInput">Study Hours:</label><br>
    <input type="number" id="hoursInput" step="0.5" placeholder="Enter study hours"><br><br>

    <!-- Add Study button -->
    <button id="addStudyBtn">Add Study</button>

    <br><br>

    <!-- Label area to display total hours, average, subjects, and feedback -->
    <label id="displayArea"></label>

    <script src="script.js"></script>
</body>
</html>
