<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Calorie Tracker</title>
</head>
<body>
    <h2>Daily Calorie Tracker</h2>

    <!-- Number input field to enter calories consumed per meal -->
    <input type="number" id="calorieInput" placeholder="Enter calories per meal">

    <!-- Add Calories button -->
    <button id="addCaloriesBtn">Add Calories</button>

    <br><br>

    <!-- Label field to display total calories, daily goal progress, and feedback messages -->
    <label id="displayLabel"></label>

    <script src="Script.js"></script>
</body>
</html>
