<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Vitals Health Report</title>
</head>
<body>
    <h2>Patient Vitals & Health Report</h2>

    <!-- Two text fields as requested by the exam prompt -->
    <label for="heartRateInput">Heart Rate (bpm):</label><br>
    <input type="text" id="heartRateInput" placeholder="Enter heart rate"><br><br>

    <label for="spo2Input">Oxygen Saturation / SpO2 (%):</label><br>
    <input type="text" id="spo2Input" placeholder="Enter SpO2"><br><br>

    <!-- Save Reading button -->
    <button id="saveReadingBtn">Save Reading</button>

    <br><br>

    <!-- Label field to show report and feedback -->
    <label id="reportLabel"></label>

    <script src="Script.js"></script>
</body>
</html>
